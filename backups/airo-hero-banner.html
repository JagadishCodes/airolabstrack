  (or your theme's page/header template). No external JS required.

<section class="airo-hero" aria-label="Airo agenTriniti hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

    .airo-hero {
      --red: #FF0000;
      --blue: #01004A;
      --white: #FFFFFF;
      --mist: #E5E1C7;
      --black: #040404;
      --vivid: #003FE1;
      --grey-line: #E4E6EE;

      position: relative;
      overflow: hidden;
      background: var(--white);
      padding: clamp(56px, 8vw, 96px) clamp(20px, 5vw, 64px);
      font-family: 'Inter', Arial, sans-serif;
      color: var(--blue);
      isolation: isolate;
    }

    /* ---------- ambient background: faint brand glows + dot grid ---------- */
    .airo-hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .airo-hero__bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      animation: airoDrift 22s ease-in-out infinite alternate;
    }

    .airo-hero__bg .glow-red {
      width: 420px;
      height: 420px;
      left: -120px;
      top: -80px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.10), rgba(255, 0, 0, 0) 70%);
    }

    .airo-hero__bg .glow-blue {
      width: 480px;
      height: 480px;
      right: -140px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(0, 63, 225, 0.09), rgba(0, 63, 225, 0) 70%);
      animation-delay: -6s;
    }

    .airo-hero__bg .dotgrid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--grey-line) 1.4px, transparent 1.4px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 85%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 85%);
      opacity: 0.55;
    }

    @keyframes airoDrift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(24px, 18px);
      }
    }

    /* ---------- layout ---------- */
    .airo-hero__grid {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: clamp(32px, 5vw, 72px);
      align-items: center;
    }

    /* ---------- eyebrow ---------- */
    .airo-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--blue);
      background: var(--mist);
      padding: 7px 14px;
      border-radius: 100px;
      opacity: 0;
      animation: airoUp .7s ease forwards;
      animation-delay: .05s;
    }

    .airo-eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(255, 0, 0, .5);
      animation: airoPulseDot 2.2s ease-out infinite;
    }

    /* ---------- headline ---------- */
    .airo-headline {
      position: relative;
      overflow: hidden;
      font-family: 'Roboto Slab', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.3rem, 4.6vw, 3.7rem);
      line-height: 1.06;
      letter-spacing: -0.5px;
      margin: 20px 0 0;
    }

    .airo-headline .line {
      display: block;
      overflow: hidden;
    }

    .airo-headline .line span {
      display: inline-block;
      opacity: 0;
      transform: translateY(110%);
      animation: airoLineUp .7s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    .airo-headline .line:nth-child(1) span {
      animation-delay: .18s;
    }

    .airo-headline .line:nth-child(2) span {
      animation-delay: .32s;
    }

    .airo-headline .accent {
      background: linear-gradient(100deg, var(--red) 0%, #ff5b3d 35%, var(--red) 60%, #b40000 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: airoLineUp .7s cubic-bezier(.22, 1, .36, 1) forwards, airoShimmer 5s linear infinite 1.2s;
    }

    /* soft passing light-sweep across the whole headline, forever, like a screen waking up */
    .airo-headline::after {
      content: "";
      position: absolute;
      top: 0;
      left: -35%;
      width: 26%;
      height: 100%;
      background: linear-gradient(115deg, transparent, rgba(255, 255, 255, .85), transparent);
      mix-blend-mode: overlay;
      transform: skewX(-14deg);
      pointer-events: none;
      animation: airoHeadlineSheen 5.5s cubic-bezier(.45, .05, .55, .95) infinite 2s;
    }

    .airo-divider {
      position: relative;
      overflow: hidden;
      display: block;
      width: 0;
      height: 4px;
      margin-top: 18px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--red), #ff8a70);
      animation: airoDraw .8s ease forwards .55s, airoBarBreathe 3.4s ease-in-out infinite 1.4s;
    }

    .airo-divider::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent);
      animation: airoBarStreak 3.4s ease-in-out infinite 1.4s;
    }

    .airo-subhead {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      color: #3a3d63;
      font-weight: 500;
      margin: 20px 0 0;
      max-width: 46ch;
      opacity: 0;
      animation: airoUp .7s ease forwards;
      animation-delay: .62s;
    }

    .airo-subhead .spot {
      font-weight: 700;
      background: linear-gradient(90deg, var(--red), var(--blue), var(--red));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: airoShimmer 6s linear infinite 2s;
    }

    /* ---------- product badge (agenTriniti — the signature moment) ---------- */
    .airo-badge {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 18px;
      padding: 11px 20px;
      background: var(--white);
      border: 1.5px solid rgba(255, 0, 0, .35);
      border-radius: 100px;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--blue);
      box-shadow: 0 6px 20px -8px rgba(255, 0, 0, 0.25);
      opacity: 0;
      animation: airoUp .7s ease forwards .72s, airoBadgeGlow 3.2s ease-in-out infinite 1.6s;
    }

    .airo-badge b {
      font-weight: 800;
    }

    .airo-badge .r {
      font-weight: 800;
      font-size: 1.06em;
      letter-spacing: .2px;
      background: linear-gradient(100deg, var(--red) 0%, #ff9466 30%, var(--red) 55%, #b40000 80%, var(--red) 100%);
      background-size: 260% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: airoTrinitiShine 3.2s ease-in-out infinite;
    }

    .airo-badge sup {
      font-size: 0.55em;
      color: var(--red);
    }

    /* ---------- stat chips ---------- */
    .airo-stats {
      list-style: none;
      margin: 22px 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      opacity: 0;
      animation: airoUp .7s ease forwards;
      animation-delay: .82s;
    }

    .airo-stats li {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: .3px;
      color: var(--blue);
      background: #F6F5EF;
      border: 1px solid var(--grey-line);
      padding: 8px 14px;
      border-radius: 8px;
      animation: airoStatActivate 6s ease-in-out infinite;
    }

    .airo-stats li:nth-child(1) {
      animation-delay: 1.6s;
    }

    .airo-stats li:nth-child(2) {
      animation-delay: 3.1s;
    }

    .airo-stats li:nth-child(3) {
      animation-delay: 4.6s;
    }

    .airo-stats li:nth-child(4) {
      animation-delay: 6.1s;
    }

    /* ---------- CTA ---------- */
    .airo-cta-row {
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      opacity: 0;
      animation: airoUp .7s ease forwards;
      animation-delay: .95s;
    }

    .airo-cta {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--red);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      padding: 15px 26px;
      border-radius: 10px;
      box-shadow: 0 10px 26px -10px rgba(255, 0, 0, 0.55);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .airo-cta::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 35%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .5), transparent);
      transform: skewX(-20deg);
      animation: airoCtaSheen 4.2s ease-in-out infinite 2s;
    }

    .airo-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -8px rgba(255, 0, 0, 0.6);
    }

    .airo-cta svg {
      transition: transform .25s ease;
    }

    .airo-cta:hover svg {
      transform: translateX(4px);
    }

    .airo-partners {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #7a7e97;
    }

    .airo-partners b {
      color: var(--blue);
      font-weight: 800;
      letter-spacing: .3px;
    }

    .airo-partners span.sep {
      margin: 0 6px;
      color: var(--grey-line);
    }

    /* ---------- visual / SVG card ---------- */
    .airo-hero__visual {
      position: relative;
      opacity: 0;
      animation: airoUp .9s ease forwards;
      animation-delay: .35s;
    }

    .airo-visual-card {
      position: relative;
      background: var(--white);
      border: 1px solid var(--grey-line);
      border-radius: 26px;
      padding: clamp(10px, 2vw, 22px);
      box-shadow: 0 30px 60px -30px rgba(1, 0, 74, 0.22);
    }

    .airo-visual-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .airo-live-tag {
      position: absolute;
      left: 50%;
      bottom: -18px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .3px;
      padding: 9px 16px;
      border-radius: 100px;
      box-shadow: 0 12px 24px -10px rgba(1, 0, 74, 0.45);
      white-space: nowrap;
    }

    .airo-live-tag .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(255, 0, 0, .6);
      animation: airoPulseDot 2.2s ease-out infinite;
    }

    /* ---------- keyframes ---------- */
    @keyframes airoUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes airoLineUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes airoDraw {
      to {
        width: 68px;
      }
    }

    @keyframes airoShimmer {
      to {
        background-position: -220% 0;
      }
    }

    @keyframes airoPulseDot {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 0, 0, .55);
      }

      70% {
        box-shadow: 0 0 0 9px rgba(255, 0, 0, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
      }
    }

    /* headline: soft light passing over the whole line, endlessly */
    @keyframes airoHeadlineSheen {
      0% {
        left: -35%;
      }

      45% {
        left: 130%;
      }

      100% {
        left: 130%;
      }
    }

    /* divider bar: slow breathing glow + a streak that runs the length of the bar */
    @keyframes airoBarBreathe {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(255, 0, 0, 0);
      }

      50% {
        box-shadow: 0 0 12px rgba(255, 0, 0, .55);
      }
    }

    @keyframes airoBarStreak {
      0% {
        left: -60%;
      }

      55% {
        left: 100%;
      }

      100% {
        left: 100%;
      }
    }

    /* badge: gentle breathing red glow around the whole pill */
    @keyframes airoBadgeGlow {

      0%,
      100% {
        box-shadow: 0 6px 20px -8px rgba(255, 0, 0, 0.25);
      }

      50% {
        box-shadow: 0 10px 28px -6px rgba(255, 0, 0, 0.45);
      }
    }

    /* "Triniti": the gradient itself keeps traveling through the letters */
    @keyframes airoTrinitiShine {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    /* stat chips: one at a time "wakes up," looping — a quiet echo of the arc's own reveal cycle */
    @keyframes airoStatActivate {

      0%,
      74%,
      100% {
        background: #F6F5EF;
        border-color: var(--grey-line);
        color: var(--blue);
        box-shadow: none;
        transform: translateY(0);
      }

      8% {
        background: #FFF0EE;
        border-color: var(--red);
        color: var(--red);
        box-shadow: 0 6px 16px -8px rgba(255, 0, 0, .4);
        transform: translateY(-2px);
      }

      20% {
        background: #F6F5EF;
        border-color: var(--grey-line);
        color: var(--blue);
        box-shadow: none;
        transform: translateY(0);
      }
    }

    /* CTA button: a light sweeps through it every few seconds, then rests */
    @keyframes airoCtaSheen {
      0% {
        left: -60%;
      }

      35% {
        left: 120%;
      }

      100% {
        left: 120%;
      }
    }

    /* ---------- responsive ---------- */
    @media (max-width: 980px) {
      .airo-hero__grid {
        grid-template-columns: 1fr;
      }

      .airo-hero__visual {
        order: 1;
        margin-bottom: 8px;
      }

      .airo-hero__content {
        order: 2;
      }

      .airo-live-tag {
        position: static;
        transform: none;
        margin: 22px auto 4px;
        width: fit-content;
      }
    }

    @media (max-width: 560px) {
      .airo-cta-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .airo-badge {
        font-size: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .airo-hero *,
      .airo-hero *::before,
      .airo-hero *::after {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
