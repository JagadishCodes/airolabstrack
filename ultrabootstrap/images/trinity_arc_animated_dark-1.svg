<svg viewBox="0 0 1500 950" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">

<style>
  .band-group { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .center-group { opacity: 0; }
  .footer-group { opacity: 0; }

  #bandA { animation: revealA 7s ease-in-out infinite; }
  #bandB { animation: revealB 7s ease-in-out infinite; }
  #bandC { animation: revealC 7s ease-in-out infinite; }
  #bandD { animation: revealD 7s ease-in-out infinite; }
  #centerGroup { animation: revealCenter 7s ease-in-out infinite; }
  #footerGroup { animation: revealFooter 7s ease-in-out infinite; }

  @keyframes revealA {
    0%   { opacity: 0; transform: translateY(18px) scale(0.92); }
    4%   { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 0; transform: translateY(0) scale(1); }
    100% { opacity: 0; }
  }
  @keyframes revealB {
    0%   { opacity: 0; transform: translateY(18px) scale(0.94); }
    10%  { opacity: 0; transform: translateY(18px) scale(0.94); }
    16%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 0; transform: translateY(0) scale(1); }
    100% { opacity: 0; }
  }
  @keyframes revealC {
    0%   { opacity: 0; transform: translateY(18px) scale(0.96); }
    20%  { opacity: 0; transform: translateY(18px) scale(0.96); }
    26%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 0; transform: translateY(0) scale(1); }
    100% { opacity: 0; }
  }
  @keyframes revealD {
    0%   { opacity: 0; transform: translateY(18px) scale(0.98); }
    30%  { opacity: 0; transform: translateY(18px) scale(0.98); }
    36%  { opacity: 1; transform: translateY(0) scale(1); }
    82%  { opacity: 1; transform: translateY(0) scale(1); }
    92%  { opacity: 0; transform: translateY(0) scale(1); }
    100% { opacity: 0; }
  }
  @keyframes revealCenter {
    0%   { opacity: 0; }
    40%  { opacity: 0; }
    48%  { opacity: 1; }
    82%  { opacity: 1; }
    92%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes revealFooter {
    0%   { opacity: 0; }
    48%  { opacity: 0; }
    56%  { opacity: 1; }
    82%  { opacity: 1; }
    92%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .seg-label { font-weight: 700; letter-spacing: 0.3px; }
  .seg-stroke { stroke: #FFFFFF; stroke-width: 2; }
</style>

